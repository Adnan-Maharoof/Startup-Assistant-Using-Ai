<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AI Startup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 50%, rgba(120, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(255, 0, 150, 0.1) 0%, transparent 50%);
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-10%, -10%); }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(120, 0, 255, 0.5);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    .login-container {
      position: relative;
      z-index: 10;
      background: rgba(15, 15, 25, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(120, 0, 255, 0.1),
        inset 0 0 80px rgba(120, 0, 255, 0.03);
      max-width: 440px;
      width: 100%;
      animation: slideIn 0.6s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7800ff, #00c8ff);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 10px 30px rgba(120, 0, 255, 0.4);
      animation: pulse 3s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #a0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .error-message {
      background: rgba(255, 50, 100, 0.1);
      border: 1px solid rgba(255, 50, 100, 0.3);
      padding: 14px;
      border-radius: 12px;
      color: #ff6b8a;
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .input-group {
      margin-bottom: 24px;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #c0c0c0;
      transition: color 0.3s ease;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(30, 30, 45, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #7800ff;
      background: rgba(30, 30, 45, 0.9);
      box-shadow: 0 0 0 4px rgba(120, 0, 255, 0.1);
    }

    .input-group input:focus + label {
      color: #7800ff;
    }

    .input-group input::placeholder {
      color: #555;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7800ff, #00c8ff);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(120, 0, 255, 0.3);
    }

    .login-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .login-button:hover::before {
      left: 100%;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(120, 0, 255, 0.5);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .divider span {
      color: #666;
      font-size: 13px;
      background: rgba(15, 15, 25, 0.8);
      padding: 0 15px;
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
    }

    .register-link p {
      color: #888;
      font-size: 14px;
    }

    .register-link a {
      color: #00c8ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      position: relative;
    }

    .register-link a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #00c8ff;
      transition: width 0.3s ease;
    }

    .register-link a:hover::after {
      width: 100%;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #555;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 40px 30px;
      }

      h2 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated particles -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
  <div class="particle" style="left: 30%; animation-delay: 4s; background: rgba(0, 200, 255, 0.5);"></div>
  <div class="particle" style="left: 40%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 50%; animation-delay: 3s; background: rgba(255, 0, 150, 0.5);"></div>
  <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
  <div class="particle" style="left: 70%; animation-delay: 2.5s; background: rgba(0, 200, 255, 0.5);"></div>
  <div class="particle" style="left: 80%; animation-delay: 4.5s;"></div>
  <div class="particle" style="left: 90%; animation-delay: 1.5s;"></div>

  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">AI</div>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Enter your credentials to access your account</p>

    <!-- Error message block -->
    {% if messages %}
      {% for message in messages %}
        <div class="error-message">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form action="/myapp/login_post/" method="POST">
      {% csrf_token %}
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="you@example.com" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="login-button">Sign In</button>
    </form>

    <div class="divider">
      <span>or</span>
    </div>

    <div class="register-link">
      <p>Don't have an account? <a href="/myapp/expertregister/">Create Account</a></p>
    </div>

    <div class="footer">
      © 2025 AI Startup Inc. All rights reserved.
    </div>
  </div>

</body>
</html>

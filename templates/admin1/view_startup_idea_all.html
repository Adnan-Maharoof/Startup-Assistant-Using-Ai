{% extends "admin1/admin_index.html" %}
{% block body %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Startup</title>

    <style>
        .table-header th {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px;
        }
        img {
            object-fit: cover;
        }
    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <!-- CHANGED TO BLUE -->
        <div class="card-header bg-primary text-white">
            Startup Details
        </div>

        <div class="card-body">
            <table class="table table-bordered table-striped table-hover align-middle text-center" id="example">
                <!-- CHANGED TO BLUE -->
                <thead class="table-primary table-header">
                    <tr>
                        <th>SL NO</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Industry</th>
                        <th>Type</th>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ i.title }}</td>
                        <td>{{ i.description }}</td>
                        <td>{{ i.industry }}</td>
                        <td>{{ i.type }}</td>
                        <td>{{ i.name }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        $('#example').DataTable();
    });
</script>

</body>
</html>

{% endblock %}

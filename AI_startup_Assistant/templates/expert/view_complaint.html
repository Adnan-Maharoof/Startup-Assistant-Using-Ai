{% extends "admin1/admin_index.html" %}
{% block body %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
  .table-header th {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 15px;
  }
</style>

<div class="container mt-5">
  <div class="card shadow-sm">

    <!-- 🔵 Header changed to BLUE -->
    <div class="card-header bg-primary text-white">
      View Complaints
    </div>

    <div class="card-body">
      <table class="table table-bordered table-striped table-hover align-middle text-center" id="example">

        <!-- 🔵 Table header changed to BLUE -->
        <thead class="table-primary table-header">
          <tr>
            <th>SL NO</th>
            <th>User</th>
            <th>Complaint</th>
            <th>Date</th>
            <th>Reply</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          {% for i in data %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.USER.name }}</td>
            <td>{{ i.complaint }}</td>
            <td>{{ i.date }}</td>

            <!-- Optional: show Pending if reply empty -->
            <td>
              {% if i.reply %}
                {{ i.reply }}
              {% else %}
                <span class="badge bg-warning text-dark">Pending</span>
              {% endif %}
            </td>

            <!-- 🔵 Reply button changed to BLUE -->
            <td>
              <a href="/myapp/sendreplys/{{ i.id }}" class="btn btn-primary btn-sm">
                Reply
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
      $('#example').DataTable({
          paging: true,
          searching: true,
          ordering: true
      });
  });
</script>

{% endblock %}

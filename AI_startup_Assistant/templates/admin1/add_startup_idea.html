{% extends "admin1/admin_index.html" %}
{% block body %}

<div class="container mt-5">
  <div class="card shadow-sm">

    <!-- 🔵 Header changed to BLUE -->
    <div class="card-header bg-primary text-white">
      Edit Startup Idea
    </div>

    <div class="card-body">
      <form action="/myapp/add_startupidea_post/" method="post">
        {% csrf_token %}

        <table class="table table-bordered align-middle">
          <tr>
            <td class="fw-bold w-25">Title</td>
            <td>
              <input
                type="text"
                class="form-control"
                name="title"
                placeholder="Enter title"
                required
              >
            </td>
          </tr>

          <tr>
            <td class="fw-bold">Description</td>
            <td>
              <input
                type="text"
                class="form-control"
                name="description"
                placeholder="Enter description"
                required
              >
            </td>
          </tr>

          <tr>
            <td class="fw-bold">Industry</td>
            <td>
              <input
                type="text"
                class="form-control"
                name="industry"
                placeholder="Enter industry"
                required>
            </td>
          </tr>

          <tr>
            <td colspan="2" class="text-center">

              <!-- 🔵 Button changed to BLUE -->
              <button type="submit" class="btn btn-primary px-4">
                Add
              </button>

            </td>
          </tr>
        </table>
      </form>
    </div>

  </div>
</div>

{% endblock %}

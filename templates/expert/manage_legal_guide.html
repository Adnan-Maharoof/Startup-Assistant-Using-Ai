{% extends "expert/expert_home.html" %}
{% block body %}

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<div class="container mt-5">
  <div class="card shadow-sm">

    <!-- 🔵 Header changed to BLUE -->
    <div class="card-header bg-primary text-white">
      Manage Legal Guide
    </div>

    <div class="card-body">

      <table class="table table-bordered table-striped table-hover align-middle text-center" id="example">
        <thead class="table-primary table-header">
          <tr>
            <th>SL NO</th>
            <th>Title</th>
            <th>Content</th>
            <th>Category</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          {% for i in data %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.title }}</td>
            <td>{{ i.content }}</td>
            <td>{{ i.category }}</td>
            <td>
              <a href="/myapp/delete_legal_guide/{{ i.id }}" class="btn btn-danger btn-sm">
                Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <div class="mt-3">
        <!-- 🔵 Button changed to BLUE -->
        <a href="/myapp/add_legal_guide/" class="btn btn-primary">
          Add New Session
        </a>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
  $(document).ready(function () {
      $('#example').DataTable({
          paging: true,
          ordering: true,
          searching: true
      });
  });
</script>

{% endblock %}

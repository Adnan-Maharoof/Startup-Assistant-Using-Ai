{% extends "admin1/admin_index.html" %}
{% block body %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
  .table-header th {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 15px;
  }
</style>

<div class="container mt-5">
  <div class="card shadow-sm">

    <!-- 🔵 Header changed to BLUE -->
    <div class="card-header bg-primary text-white">
      Manage Notification
    </div>

    <div class="card-body">
      <table class="table table-bordered table-striped table-hover align-middle text-center" id="example">

        <!-- 🔵 Table header changed to BLUE -->
        <thead class="table-primary table-header">
          <tr>
            <th>SL NO</th>
            <th>Notification</th>
            <th>Details</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          {% for i in data %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.notification }}</td>
            <td>{{ i.details }}</td>
            <td>{{ i.date }}</td>
            <td>
              <a href="/myapp/delete_notification/{{ i.id }}"
                 class="btn btn-danger btn-sm"
                 onclick="return confirm('Are you sure you want to delete this notification?');">
                 Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>

        <tfoot>
          <tr>
            <td colspan="5" class="text-center">

              <!-- 🔵 Button changed to BLUE -->
              <a href="/myapp/add_notification_get/" class="btn btn-primary">
                Add Notification
              </a>

            </td>
          </tr>
        </tfoot>

      </table>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    $('#example').DataTable({
      paging: true,
      searching: true,
      ordering: true
    });
  });
</script>

{% endblock %}
